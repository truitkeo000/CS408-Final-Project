{% extends 'core/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{{ page_title }}</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Expense
        </button>

        <a href="{% url 'budget' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
